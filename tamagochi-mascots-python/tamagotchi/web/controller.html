<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tim the Tower Beaver</title>
<style>
  :root { --bg: #0b0c12; --card: #171923; --ink: #f2f2f2; --dim: #8a8fa3; --accent: #a31f34; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink);
         min-height: 100dvh; display: flex; flex-direction: column; padding: 16px; gap: 14px; }
  h1 { font-size: 1.4rem; margin: 0; }
  .sub { color: var(--dim); margin: 0; font-size: .9rem; }
  select { width: 100%; font: inherit; padding: 12px; border-radius: 10px; background: var(--card);
           color: var(--ink); border: 1px solid #2a2d3a; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: .85rem; }
  .bar { height: 10px; border-radius: 5px; background: #222533; overflow: hidden; }
  .bar i { display: block; height: 100%; transition: width .4s; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: 600 1.05rem system-ui; padding: 22px 8px; border-radius: 14px; border: 0; color: #fff;
           background: var(--card); touch-action: manipulation; transition: transform .08s; }
  button:active { transform: scale(.94); }
  button:disabled { opacity: .45; }
  button .e { display: block; font-size: 1.9rem; }
  #cheer { background: var(--accent); }
  #status { text-align: center; color: var(--dim); min-height: 1.4em; font-size: .9rem; }
  ol { margin: 0; padding-left: 1.3rem; color: var(--dim); font-size: .85rem; }
</style>
</head>
<body>
  <div>
    <h1>🦫 Tim the Tower Beaver</h1>
    <p class="sub" id="stage">Look up at the Green Building — you're controlling it.</p>
  </div>
  <select id="school" aria-label="Your school"></select>
  <div class="stats" id="stats"></div>
  <div class="grid">
    <button data-a="feed"><span class="e">🍕</span>Feed</button>
    <button data-a="play"><span class="e">⚽</span>Play</button>
    <button data-a="pet"><span class="e">💖</span>Pet</button>
    <button data-a="clean"><span class="e">🧽</span>Clean</button>
    <button data-a="sleep"><span class="e">😴</span>Tuck in</button>
    <button data-a="cheer" id="cheer"><span class="e">🎆</span>Cheer!</button>
  </div>
  <p id="status"></p>
  <div><p class="sub">Top schools · last 5 min</p><ol id="board"></ol></div>
<script>
const COLORS = { hunger: "#ff8c00", happy: "#ff3ca0", energy: "#ffe600", clean: "#00dcff" };
const $ = (id) => document.getElementById(id);
let schoolNames = {};

async function loadSchools() {
  const list = await (await fetch("/api/schools")).json();
  for (const [id, label] of list) {
    schoolNames[id] = label;
    $("school").append(new Option(label, id));
  }
  try { $("school").value = localStorage.getItem("school") || "mit"; } catch {}
  $("school").onchange = () => { try { localStorage.setItem("school", $("school").value); } catch {} };
}

function show(state) {
  const labels = { egg: "🥚 Egg — tap anything to warm it up!", baby: "🐣 Baby beaver", adult: "🦫 Grown-up beaver" };
  $("stage").textContent = `${labels[state.stage]} · mood: ${state.mood}` +
    (state.stage === "egg" ? ` · ${state.hatch_at - state.care} taps to hatch` : "");
  $("stats").innerHTML = Object.entries(state.stats).map(([k, v]) =>
    `<span>${k}</span><div class="bar"><i style="width:${v}%;background:${COLORS[k]}"></i></div>`).join("");
  $("board").innerHTML = state.leaderboard.map(([id, n]) => `<li>${schoolNames[id] || id} — ${n}</li>`).join("");
}

async function act(action) {
  const r = await fetch("/api/action", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, school: $("school").value }) });
  const j = await r.json();
  if (!r.ok) { $("status").textContent = j.error; return; }
  $("status").textContent = "✨ Look up!";
  navigator.vibrate?.(30);
  show(j.state);
}

document.querySelectorAll("button[data-a]").forEach((b) => b.onclick = () => act(b.dataset.a));
loadSchools().then(async function poll() {
  try { show(await (await fetch("/api/state")).json()); } catch {}
  setTimeout(poll, 2000);
});
</script>
</body>
</html>
